<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Aerial</title>
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --label: #000; --secondary: rgba(60,60,67,.6); --tertiary: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.18); --tint: #007aff; --fill: rgba(118,118,128,.12); --danger: #ff3b30;
    /* --fill 是半透明的, 挂在吸顶条上会透出下面的内容; 这个是它压在页面底色上合成出的实色。 */
    --fill-solid: #e4e4e9;
    --bar: rgba(249,249,249,.82); --bar-line: rgba(0,0,0,.14); --scrim: rgba(0,0,0,.32); --sheet: #f2f2f7;
    --ease-out: cubic-bezier(.23,1,.32,1); --ease-drawer: cubic-bezier(.32,.72,0,1);
    --tabbar: calc(50px + env(safe-area-inset-bottom));
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --card: #1c1c1e; --label: #fff; --secondary: rgba(235,235,245,.6); --tertiary: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.6); --tint: #0a84ff; --fill: rgba(118,118,128,.24); --danger: #ff453a;
      --fill-solid: #1c1c1f;
      --bar: rgba(22,22,22,.82); --bar-line: rgba(255,255,255,.12); --scrim: rgba(0,0,0,.5); --sheet: #1c1c1e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* 滑到顶/底继续拖时, 浏览器默认会做一段回弹(带下拉刷新), 安卓 WebView 还会把整页拉伸。
     这里两层一起关: CSS 这层管浏览器和 WebView 的页面侧, 遥控器里另外把 View 的 overscroll 也关了。 */
  html, body { overscroll-behavior: none; overscroll-behavior-y: none; }
  /* 手机页一律不画滚动条: 滚动照样能用, 主页面、抽屉、日志、横排壁纸那些条都藏起来。 */
  * { scrollbar-width: none; -ms-overflow-style: none; }
  *::-webkit-scrollbar { width: 0; height: 0; display: none; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--label);
    font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "HarmonyOS Sans SC", "MiSans", system-ui, sans-serif;
  }
  button { font: inherit; color: inherit; }
  /* A display rule would otherwise show what is hidden. */
  [hidden] { display: none !important; }

  main { max-width: 720px; margin: 0 auto; padding: env(safe-area-inset-top) 16px calc(var(--tabbar) + 32px); }
  header { padding: 28px 4px 4px; }
  header h1 { display: block; vertical-align: middle; font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin: 0; }
  header p { margin: 2px 0 0; color: var(--secondary); font-size: 15px; }

  h2 { font-size: 13px; font-weight: 400; color: var(--secondary); margin: 28px 16px 7px; }
  h2.big { font-size: 20px; font-weight: 700; text-transform: none; letter-spacing: -.01em; color: var(--label); margin: 28px 4px 10px; }
  .foot { color: var(--secondary); font-size: 13px; margin: 7px 16px 0; }
  .foot .link { font-size: 13px; }
  #sections .foot { margin: 8px 4px 0; }
  section > .list:first-child, section > .hero:first-child { margin-top: 14px; }

  /* Inset grouped list, as in iOS Settings. */
  .list { background: var(--card); border-radius: 12px; overflow: hidden; }
  .item {
    position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 11px 16px;
    border: 0; background: none; text-align: left; text-decoration: none; transition: background-color .2s ease;
  }
  .item + .item::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
  .item { -webkit-tap-highlight-color: transparent; cursor: pointer; user-select: none; }
  div.item:active, button.item:active, label.item:active { background: var(--fill); transition-duration: 0s; }
  .item .txt { flex: 1; min-width: 0; }
  .item .sub { display: block; font-size: 13px; color: var(--secondary); margin-top: 2px; }
  .item .val { color: var(--secondary); white-space: nowrap; }
  .item .chev { color: var(--tertiary); flex-shrink: 0; }
  /* 个性化设置: 一项设置一张圆角卡, 卡里选项一排一个, 当前值打勾并染成主题色。 */
  .pcard { margin-top: 10px; }
  /* 吸顶标题下面那道 24px 渐隐会压住页面第一张气泡, 正文整体往下站一点。
     别再按容器名字一条条列选择器了 —— 应用菜单是 #homeBody > .view > .pcard,
     直播菜单是 #liveBody > .pcard, 个性化是 .pgroup > .pcard, 「更多」里还有 .hero,
     只要漏掉一种就还是削顶。直接按页签给正文留这段空档, 第一张不管是卡还是大图都站得住。 */
  main > section[data-tab] { padding-top: 22px; }
  .pcard .phead { cursor: default; }
  .pcard .phead:active { background: none; }
  /* 选项一排按钮: 一排摆满, 文字左右居中; 选中不画勾, 直接染主题色。 */
  .pcard .prows { display: flex; flex-direction: column; gap: 8px; padding: 2px 12px 12px; }
  .pcard .prow { display: flex; flex-wrap: wrap; gap: 8px; }
  .pcard .pbtn {
    appearance: none; border: 0; border-radius: 10px; background: var(--fill); color: var(--label);
    flex: 1 1 0; min-width: 74px; padding: 11px 8px; font-size: 15px; text-align: center; line-height: 1.25;
    cursor: pointer; transition: background-color .15s ease, color .15s ease;
  }
  .pcard .pbtn[aria-checked="true"] { background: var(--card); color: var(--tint); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.10); }
  .pcard .pbtn:disabled { opacity: .55; }
  /* 不出选项、只有一颗按钮的(扫码登录、打开登录页、立即开始): 与上面那排选项同一个形状, 只占一排一颗。
     以前这些是纯文字链接, 看着不像按钮, 也不好按。 */
  .pact {
    appearance: none; border: 0; border-radius: 10px; background: var(--card); color: var(--tint);
    display: block; box-sizing: border-box; width: 100%; padding: 12px 10px;
    font-size: 15px; font-weight: 600; text-align: center; line-height: 1.25;
    text-decoration: none; cursor: pointer;
    box-shadow: inset 0 0 0 .5px rgba(60,60,67,.10), 0 1px 2px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.06);
    transition: background-color .15s ease, box-shadow .15s ease;
  }
  .pact:active { background: var(--fill); box-shadow: none; }
  .pact:disabled { opacity: .55; }
  .pact.danger { color: var(--danger); }
  /* 诊断正文和那排「复制 / 下载」现在都在同一张气泡里, 左右留出和按钮一致的边。 */
  .pcard .diag { margin: 0 12px 10px; }
  .pcard .row { padding: 0 12px 12px; margin-top: 0; }
  .pcard .row .btn { border-radius: 10px; }
  /* 气泡里的小节标题(设置城市 / 设置城市的显示名称): 只做分组, 不加分隔线。 */
  .pcard .psub { padding: 14px 16px 2px; font-size: 13px; color: var(--secondary); }
  /* 当前版本那一行只是信息, 不加粗。 */
  .pcard .pver b { font-weight: 400; }
  /* 只有说明、没有标题的一块: 顶在气泡最上面, 与选项卡名字不重复。 */
  .pcard .pnote { color: var(--secondary); font-size: 13px; line-height: 1.45; margin: 0; padding: 13px 16px 3px; }
  /* 隐藏卡: 标题、说明、按钮同在一张气泡里。 */
  .pcard .ptitle { padding: 15px 16px 0; font-size: 17px; font-weight: 600; color: var(--label); }
  .pcard .pdesc { margin: 0; padding: 6px 16px 0; color: var(--secondary); font-size: 13px; line-height: 1.45; }
  /* 气泡里的内容区(卡片网格、按钮组): 左右留出与标题一致的边。 */
  .pcard .pbody { padding: 10px 12px 12px; }
  /* 隐藏卡片: 一张气泡, 标题下面一行一颗行按钮, 右边是「显示」。 */
  .pcard .hrow {
    appearance: none; border: 0; display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box;
    padding: 8px; border-radius: 10px; background: var(--fill); text-align: left;
    cursor: pointer; transition: background-color .15s ease;
  }
  .pcard .hrow + .hrow { margin-top: 8px; }
  .pcard .hrow:active { background: var(--fill-solid); }
  .pcard .hrow .thumb {
    width: 52px; height: 34px; border-radius: 7px; flex: none; overflow: hidden;
    object-fit: cover; background: var(--fill-solid);
  }
  .pcard .hrow .hname {
    flex: 1; min-width: 0; font-size: 15px; font-weight: 500; color: var(--label);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .pcard .hrow .hshow {
    flex: none; padding: 6px 13px; border-radius: 8px; background: var(--card); color: var(--tint);
    font-size: 14px; font-weight: 600; cursor: pointer; -webkit-user-select: none; user-select: none;
    box-shadow: inset 0 0 0 .5px rgba(60,60,67,.10), 0 1px 2px rgba(0,0,0,.06), 0 3px 8px rgba(0,0,0,.07);
  }
  .pcard .hrow .hshow:active { background: var(--fill); box-shadow: none; }
  .pcard .hrow .hshow[disabled] { opacity: .5; }
  /* 气泡里的输入行: 浅灰输入框 + 右边一颗蓝色保存按钮。 */
  .pcard .pfield { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px; }
  .pcard .pfield input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--label);
    background: var(--fill); border: 0; outline: none; border-radius: 9px; padding: 10px 12px;
    transition: background-color .15s ease, box-shadow .15s ease;
  }
  .pcard .pfield input:focus { background: var(--card); box-shadow: 0 0 0 1.5px var(--tint), 0 1px 3px rgba(0,0,0,.10); }
  .pcard .pfield input:disabled { opacity: .6; }
  /* 保存: 白底 + 一道内描边加两层浅投影, 挨着浅灰输入框也立得起来; 没改动时依旧白, 只是字淡。 */
  .pcard .pfield .psave {
    appearance: none; border: 0; border-radius: 10px; padding: 11px 18px; flex: none;
    font-size: 15px; font-weight: 600; color: var(--tint); background: var(--card); cursor: pointer;
    box-shadow: inset 0 0 0 .5px rgba(60,60,67,.12), 0 1px 2px rgba(0,0,0,.06), 0 3px 8px rgba(0,0,0,.07);
    transition: background-color .15s ease, box-shadow .15s ease, color .15s ease;
  }
  .pcard .pfield .psave:active { background: var(--fill); box-shadow: inset 0 0 0 .5px rgba(60,60,67,.12); }
  .pcard .pfield .psave:disabled {
    background: var(--card); color: var(--tint); -webkit-text-fill-color: var(--tint); opacity: .72; cursor: default;
    box-shadow: inset 0 0 0 .5px rgba(60,60,67,.10), 0 1px 2px rgba(0,0,0,.05), 0 3px 8px rgba(0,0,0,.05);
  }
  /* 气泡里的按钮一律白底 + 内描边和浅投影, 和「输入密码查看」同款:
     浅灰只留给输入框和隐藏卡片那一行。 */
  .pact.soft {
    background: var(--card); color: var(--tint);
    box-shadow: inset 0 0 0 .5px rgba(60,60,67,.10), 0 1px 2px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.06);
  }
  .pact.soft:active { background: var(--fill); box-shadow: inset 0 0 0 .5px rgba(60,60,67,.10); }
  .pact.soft.danger { color: var(--danger); }
  /* 不放进气泡的按钮(详情页的取消、解散文件夹): 白底一块, 单独一条。 */
  .psolo {
    appearance: none; border: 0; border-radius: 10px; background: var(--card); color: var(--tint);
    display: block; width: 100%; margin-top: 10px; padding: 12px 10px;
    font-size: 15px; font-weight: 600; text-align: center; cursor: pointer;
    box-shadow: inset 0 0 0 .5px rgba(60,60,67,.10), 0 1px 2px rgba(0,0,0,.05), 0 2px 6px rgba(0,0,0,.06);
  }
  .psolo:active { background: var(--fill); box-shadow: none; }
  .psolo.danger { color: var(--danger); }
  /* 一行两颗按钮时与上面那排同款, 左右平分。 */
  .pcard .row .pact { flex: 1 1 0; width: auto; min-width: 0; }
  .pcard .prow .pact { flex: 1 1 0; width: auto; min-width: 0; }
  /* 分类选项卡: 没选中的只留图标, 选中的那颗长出图标+名字。 */
  .gtabs { display: flex; gap: 4px; align-items: center; background: var(--fill-solid); border-radius: 10px; padding: 3px; margin: 6px 0 4px; max-width: 100%; overflow: hidden; }
  .gtabs button {
    appearance: none; border: 0; background: none; border-radius: 8px; height: 36px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    flex: 0 1 40px; min-width: 0; padding: 0 6px; overflow: hidden; color: var(--secondary); font-size: 13px; cursor: pointer;
  }
  .gtabs button[aria-checked="true"] {
    /* 选中的那一格固定按五个汉字的宽度, 两个字三个字的也留这么宽, 一排看起来才齐。 */
    background: var(--card); color: var(--label); font-weight: 600; flex: 0 0 auto; width: calc(5em + 42px); padding: 0 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12);
  }
  .gtabs button .glabel { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gtabs svg { width: 18px; height: 18px; flex: none; }
  /* 其他页的三颗选项卡: 都带图标和名字, 平分一行; 选中的那颗白底染一个字色。 */
  #otabs { margin: 22px 0 6px; }
  .otabs button, .otabs button[aria-checked="true"] {
    flex: 1 1 0; width: auto; min-width: 0; padding: 0 6px; font-weight: 500;
    box-shadow: none; background: none; color: var(--secondary);
  }
  .otabs button[aria-checked="true"] { background: var(--card); color: var(--label); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .otabs button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 壁纸那四颗只有字的小选项卡: 不带图标, 平分一行, 选中的白底染字色。 */
  .wtabs button, .wtabs button[aria-checked="true"] {
    flex: 1 1 0; width: auto; min-width: 0; padding: 0 6px; font-weight: 500;
    box-shadow: none; background: none; color: var(--secondary); font-size: 14px;
  }
  .wtabs button[aria-checked="true"] { background: var(--card); color: var(--tint); font-weight: 600; }
  .wtabs button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wxlist { margin-top: 10px; }
  .pcard .popen { color: var(--tint); justify-content: center; }
  .pcard .popen .txt { flex: 0 1 auto; font-weight: 600; text-align: center; }
  .pcard .popen .chev { margin-left: 6px; }
  .pcard .popen:active { background: var(--fill); }
  .pinfo { display: flex; align-items: center; padding: 2px 14px 12px; }
  .pinfo .val { font-size: 14px; color: var(--secondary); }
  .pqr { padding: 0 14px 12px; }
  /* 二维码必须是方的: 圆角会把三个角上的定位块啃掉, 手机上就认不出来了。 */
  .pqr img { width: 180px; height: 180px; display: block; margin: 0 auto; border-radius: 0; background: #fff; }
  .pqr .foot.center { text-align: center; margin: 8px 0 2px; }
  .link.center.wide { display: block; width: 100%; text-align: center; margin: 6px 0 4px; }
  .pin-dots { display: flex; gap: 12px; justify-content: center; margin: 12px 0 4px; }
  .pin-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--fill); transition: background-color .15s ease; }
  .pin-dot.on { background: var(--tint); }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 6px; }
  .pin-num { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 6px; }
  .pin-num .pinkey { font-size: 22px; padding: 12px 0; }
  .pin-num .del { font-size: 20px; }
  .pin-pad .wide { grid-column: 1 / -1; font-size: 15px; padding: 10px 0; }
  /* 密码键: 白底、圆角、不描边; 按下去整颗染主题色。 */
  .pin-pad .pinkey, .pin-num .pinkey {
    appearance: none; border: 0; outline: 0; border-radius: 14px; padding: 15px 0; font-size: 22px; font-weight: 600;
    background: var(--card); color: var(--label); cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,.06);
    transition: background-color .12s ease, color .12s ease;
  }
  .pin-pad .pinkey:active, .pin-num .pinkey:active { background: var(--tint); color: #fff; }
  .pnum { justify-content: flex-end; gap: 8px; }
  .pnum .pref-num { width: 84px; }
  .pnum .unit { color: var(--secondary); font-size: 13px; flex: none; }
  .psld { gap: 10px; }
  /* 滑块: 轨道和蓝色进度各画一条, 圆点自己画, 位置按圆点半径收进去, 两头才对得上。 */
  .psld .rg { position: relative; flex: 1; min-width: 0; height: 30px; }
  .psld .rg .track { position: absolute; left: 12px; right: 12px; top: 13px; height: 4px; border-radius: 2px; background: var(--fill); }
  /* 进度条和圆点用同一个百分比、同一段可走宽度算位置, 所以蓝条末端永远压在圆点中心上。
     系统自带的圆点只在下面留作拖拽用, 看不见(opacity 0), 看得见的是自己画的那颗。 */
  .psld .rg .fill { position: absolute; left: 12px; top: 13px; height: 4px; border-radius: 2px; background: var(--tint); width: 0; }
  .psld .rg .knob {
    position: absolute; top: 3px; left: 0; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.28), 0 0 0 .5px rgba(0,0,0,.12); pointer-events: none;
  }
  .psld .rg input[type=range] {
    -webkit-appearance: none; appearance: none; position: absolute; inset: 0; width: 100%; height: 30px; margin: 0; background: none;
  }
  .psld .rg input[type=range]::-webkit-slider-runnable-track { height: 4px; background: none; }
  .psld input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 24px; height: 24px; margin-top: -10px; border-radius: 50%;
    background: transparent; box-shadow: none; opacity: 0;
  }
  .psld input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--fill); }
  .psld input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border: 0; border-radius: 50%; background: #fff; }
  .psld.muted input[type=range] { opacity: .45; }
  .psld .val { min-width: 46px; text-align: right; color: var(--secondary); font-variant-numeric: tabular-nums; }
  .mutebtn {
    appearance: none; border: 0; border-radius: 9px; padding: 6px 10px; font-size: 13px; flex: none;
    background: var(--fill); color: inherit; cursor: pointer;
  }
  .mutebtn[aria-checked="true"] { background: var(--tint); color: #fff; font-weight: 600; }
  /* 儿童与长辈窗口: 上面是两页卡片的切换键, 下面一排三张带封面和勾选编号。 */
  .ptabs { display: flex; gap: 4px; background: var(--fill); border-radius: 10px; padding: 3px; margin: 8px 0 10px; }
  .ptabs button {
    flex: 1; appearance: none; border: 0; border-radius: 8px; padding: 8px 0; background: none;
    font-size: 14px; color: var(--secondary); cursor: pointer;
  }
  .ptabs button[aria-checked="true"] { background: var(--card); color: var(--label); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .kgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .kcard { position: relative; padding: 0; border: 0; border-radius: 10px; overflow: hidden; background: var(--fill); aspect-ratio: 16 / 10; }
  .kcard img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .5; }
  .kcard[disabled] img { opacity: .35; }
  .kcard .klock {
    position: absolute; top: 4px; right: 4px; padding: 1px 5px; border-radius: 7px;
    background: rgba(0,0,0,.55); color: #fff; font-size: 10px; line-height: 14px;
  }
  .kcard[aria-checked="true"] img { opacity: 1; }
  .kcard[aria-checked="true"] { outline: 2px solid var(--tint); outline-offset: -2px; }
  .knum {
    position: absolute; top: 4px; left: 4px; min-width: 18px; height: 18px; border-radius: 9px; padding: 0 4px;
    background: var(--tint); color: #fff; font-size: 11px; line-height: 18px; text-align: center; font-weight: 600;
  }
  .knum:empty { display: none; }
  .kc {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 4px 3px; font-size: 11px; line-height: 1.2;

  .agrid.incard { background: none; border-radius: 0; padding: 6px 0 6px; }

  .icon-sq { width: 30px; height: 30px; border-radius: 7px; background: var(--tint); color: #fff; display: grid; place-items: center; flex-shrink: 0; }

<main>
<header>
  <div class="hrow">
    <button class="link back" id="homeBack" hidden><svg width="11" height="18" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2L2 10l8 8"/></svg><span data-i18n="tab_home"></span></button>

function confirmSheet(message, okLabel, danger) {

      okB.style.marginTop = '16px';
      okB.onclick = () => finish(true);
      body.appendChild(okB);
      const cancel = el('button', 'psolo', t('cancel'));
      cancel.onclick = () => finish(false);

/*
 * Pull the sheet down to close it, as on iOS. A flick is enough (by speed, not distance); a slow
 * pull closes it past a third of its height, otherwise it springs back. Only from its top, so a
 * long sheet still scrolls, and only the first finger counts.
 */
(() => {
  const panel = sheet.querySelector('.sheet');
  let id = null, x0 = 0, y0 = 0, t0 = 0, dy = 0, dragging = false;
  const touch = e => [...e.changedTouches].find(t => t.identifier === id);
  panel.addEventListener('touchstart', e => {
    if (id !== null || e.touches.length !== 1 || panel.scrollTop > 0) return;
    const t = e.touches[0];
    id = t.identifier; x0 = t.clientX; y0 = t.clientY; t0 = performance.now(); dy = 0; dragging = false;
  }, { passive: true });
  panel.addEventListener('touchmove', e => {
    const t = touch(e); if (!t) return;
    const d = t.clientY - y0;
    if (!dragging) {
      // A sideways or upward move is not a pull: let it scroll or tap as usual.
      if (d < 0 || Math.abs(t.clientX - x0) > Math.abs(d)) { id = null; return; }
      if (d < 8) return;
      dragging = true; panel.style.transition = 'none';
    }
    e.preventDefault();
    dy = Math.max(0, d - 8);
    panel.style.transform = `translateY(${dy}px)`;
  }, { passive: false });
  const end = e => {
    if (!touch(e)) return;
    id = null;
    if (!dragging) return;
    dragging = false;
    const v = dy / Math.max(1, performance.now() - t0);
    // Back to the stylesheet's transitions: from where the finger left it, on to closed or open.
    panel.style.transition = ''; panel.style.transform = '';
    if (v > 0.11 || dy > panel.offsetHeight / 3) closeSheet();
  };
  panel.addEventListener('touchend', end);
  panel.addEventListener('touchcancel', end);
})();

function guessWpTab() {

  if (w) {
    if (w.kind === 'photo' || w.kind === 'photos') return 'photos';

    // 按键停不停自己的视频, 和电视一样; 航拍影片一直动。

let uploading = 0;

async function sendPhotos(files) {

  try {
    const fd = new FormData(); files.forEach((f, i) => fd.append('photo' + i, f, f.name));

    const next = await r.json(); uploading = 0; take(next);
    toast(next.added ? t('toast_added', { n: next.added }) : t('toast_no_photos'));
  } catch (err) { uploading = 0; stateJson = ''; render(); toast(t('toast_send_fail')); }

let sendingVideo = '';
function videoAddBtn() {
  const up = el('label', 'btn plain add');
  up.innerHTML = `${ICON.plus}<span></span><input type="file" accept=".mp4,.mov,video/mp4,video/quicktime" multiple hidden>`;
  up.querySelector('span').textContent = sendingVideo || t('videos_upload');
  if (sendingVideo) up.setAttribute('disabled', '');
  up.querySelector('input').onchange = e => sendVideos([...e.target.files], up);
  return up;
}
async function sendVideos(files, btn) {
  if (!files.length) return;
  const label = btn ? btn.querySelector('span') : null;
  if (btn) btn.setAttribute('disabled', '');
  let added = 0;
  for (const [i, file] of files.entries()) {
    sendingVideo = t('sending_video', { n: i + 1, total: files.length });
    if (label) label.textContent = sendingVideo;
    if (!file.size || file.size > 200 * 1024 * 1024) continue;
    try {
      // The TV server takes the raw bytes as the body and the name in the query, not multipart.
      const r = await fetch(base + 'api/videos/send?name=' + encodeURIComponent(file.name), {
        method: 'POST', body: file, headers: { 'Content-Type': file.type || 'video/mp4' }
      });
      if (!r.ok) throw new Error(r.status);
      const next = await r.json(); if (next.saved) added++; take(next);
    } catch (err) { /* Keep going: a failed film should not discard the rest of the batch. */ }
  }
  sendingVideo = '';
  if (btn) { btn.removeAttribute('disabled'); const inp = btn.querySelector('input'); if (inp) { inp.value = ''; inp.disabled = false; } }
  stateJson = ''; render();
  toast(t('toast_videos_added', { n: added, failed: files.length - added }));
}

/* Files dropped anywhere on the page, as from a computer's folder: photos to the wallpapers, videos to the screensaver. */
let dragDepth = 0;
const carriesFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
window.addEventListener('dragenter', e => { if (!carriesFiles(e)) return; e.preventDefault(); dragDepth++; $('#drop').classList.add('on'); });
window.addEventListener('dragover', e => { if (carriesFiles(e)) e.preventDefault(); });
window.addEventListener('dragleave', e => { if (!carriesFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $('#drop').classList.remove('on'); } });
window.addEventListener('drop', e => {
  if (!carriesFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $('#drop').classList.remove('on');
  const files = [...e.dataTransfer.files];
  const photos = files.filter(f => f.type.startsWith('image/'));
  const videos = files.filter(f => /^video\/(mp4|quicktime)$/.test(f.type) || /\.(mp4|mov)$/i.test(f.name));
  if (!photos.length && !videos.length) { toast(t('drop_none')); return; }
  // Both land in the wallpaper group: the photos at its top, the videos under the screensaver.
  show('more', true);
  prefsTab = 'wallpaper'; applyPrefsTab(); renderTabs();
  if (photos.length) sendPhotos(photos);
  if (videos.length) sendVideos(videos);
});

/* ---- 个性化设置: 服务端发来的那一份(和电视面板一一对应) ---- */
let prefs = null, prefsJson = '', prefsTimer = 0;
async function loadPrefs() {
  try {
    const r = await fetch(base + 'api/prefs?lang=' + LANG);
    if (!r.ok) return;
    const text = await r.text();
    // 和上次一模一样就不重画: 电视那边改了设置才换, 免得轮询把正在拖的滑块打断。
    if (text === prefsJson) return;
    prefsJson = text;
    prefs = JSON.parse(text);
    // 家长密码开没开决定「隐藏的卡片」要不要先验密码: 一变就重画主屏那一段。
    const pinNow = !!((prefs.kids || {}).pinSet);
    renderPrefs();
    // state 还没到的时候不能重画主屏: 首次进页面这两件事是并发的。
    if (pinNow !== prefsPinSeen) { prefsPinSeen = pinNow; if (state) { renderArrange(false); renderLive(); } }
  } catch (e) {}
}
async function setPref(key, value, after, quiet) {
  try {
    const r = await api('api/prefs', { key: key, value: value });
    if (!r.ok) throw new Error('not saved');
    await loadPrefs();
    if (after) after();
    return true;
  } catch (e) {
    if (!quiet) toast(t('toast_set_fail'));
    await loadPrefs();
    if (after) after();
    return false;
  }
}

const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const toMinutes = v => { const p = String(v || '').split(':'); return Math.max(0, Math.min(1440, (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0))); };

/* 「自定义」那一行: 分钟数直接填, 最晚到那个时间是 HH:MM。 */
function customRow(it, changed) {
  const row = el('div', 'item pnum');
  row.appendChild(el('span', 'unit', it.clock ? t('custom_time') : t('custom')));
  let inp;
  if (it.clock) {
    inp = el('input', 'pref-num'); inp.type = 'time'; inp.value = hhmm(parseInt(it.value, 10) || 0);
    inp.onchange = () => changed(it.key, String(toMinutes(inp.value)));
  } else {
    inp = el('input', 'pref-num'); inp.type = 'number'; inp.inputMode = 'numeric'; inp.value = it.value;
    if (it.min !== undefined) inp.min = it.min;
    if (it.max !== undefined) inp.max = it.max;
    inp.onchange = () => changed(it.key, String(Math.max(0, parseInt(inp.value, 10) || 0)));
  }
  row.appendChild(inp);
  return row;
}

/* 一项设置一张圆角卡: 标题和说明在上, 选项一排一个, 选中的那行打勾并染成主题色。 */
// after: 存完以后要做的事; save: 自己那份保存接口, 不给就走 /api/prefs(个性化面板那份)。
/* B 站账号: 与电视面板同一套扫码登录; 手机上点一下就在这张卡里画二维码并轮询状态。 */
function biliCard(card) {
  const btn = el('button', 'pact');
  btn.type = 'button';
  const stat = el('p', 'foot', '');
  const qrBox = el('div', 'pqr'); qrBox.hidden = true;
  const img = el('img', 'qimg'); img.alt = 'QR'; img.decoding = 'async';
  const qrTip = el('p', 'foot center', '');
  // 二维码下面两颗: 左边打开登录页(由外壳交给系统), 右边复制链接(哪个浏览器里都能用)。
  let qrUrl = '';
  const qrOpen = el('button', 'pact');
  qrOpen.type = 'button';
  qrOpen.onclick = () => {
    if (!qrUrl) return;
    toast(copyText(qrUrl) ? t('bili_copied') : t('bili_copy_manual'));
  };
  qrOpen.hidden = true;
  // 打开登录页走真链接: 遥控器外壳的 WebViewClient 现在把「不是这台电视」的地址交给系统,
  // 所以点下去会由浏览器或 B 站 App 接(以前一律塞回同一个 WebView, 结果掉到 error 页)。
  const qrApp = el('a', 'pact');
  qrApp.setAttribute('rel', 'noopener');
  qrApp.hidden = true;
  // 点下去整页就要交给系统了, 这里先留一条记录再走: 万一还是不跳, 电视日志里能看清点到的是哪一版、
  // 哪个地址、有没有真的触发跳转, 不用再靠猜。
  qrApp.onclick = (e) => {
    if (!qrUrl) { e.preventDefault(); toast(t('bili_copy_manual')); return; }
    try { fetch(base + 'api/bili/open', { method: 'POST', body: new URLSearchParams({ url: qrUrl, pv: PAGE_VER }), keepalive: true }); } catch (e2) {}
  };
  const openRow = el('div', 'prow');
  openRow.append(qrApp, qrOpen);
  qrBox.append(img, qrTip, openRow);
  const rows = el('div', 'prows');
  rows.append(btn);
  card.append(rows, stat, qrBox);

  let timer = 0, shownQr = '';
  const stop = () => { if (timer) { clearInterval(timer); timer = 0; } };
  const apply = (r) => {
    const logged = !!r.loggedIn;
    btn.textContent = logged ? t('bili_logout') : t('bili_login');
    btn.disabled = false;
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        await fetch(base + 'api/bili', { method: 'POST', body: new URLSearchParams({ action: logged ? 'logout' : 'login' }) });
      } catch (e) {}
      if (logged) {
        stop(); qrBox.hidden = true; shownQr = ''; stat.textContent = '';
        prefsJson = ''; loadPrefs(); refresh();
      } else {
        stat.textContent = t('bili_wait');
        if (!timer) timer = setInterval(load, 1500);
      }
      load();
    };
    if (logged) {
      stop(); qrBox.hidden = true;
      stat.textContent = r.uid ? ('UID ' + r.uid) : '';
    } else if (r.phase === 'ok') {
      stop(); qrBox.hidden = true; shownQr = ''; stat.textContent = t('bili_ok');
      prefsJson = ''; loadPrefs(); refresh();
    } else if (r.hasQr && (r.phase === 'qr' || r.phase === 'wait' || r.phase === 'confirm')) {
      qrBox.hidden = false;
      /* 链接先落地再挂到按钮上。以前是先取 href 后赋 qrUrl, 首帧只拿到空串, 只能退回 '#':
         点下去不是跳转, 而是把页面滚回顶部, 那颗按钮实际上一直是死的。 */
      qrUrl = r.url || '';
      if (shownQr !== String(r.qrStamp || 'a')) {
        shownQr = String(r.qrStamp || 'a');
        img.src = base + 'api/bili/qr?v=' + Date.now();
        qrTip.textContent = t('bili_longpress');
        qrOpen.textContent = t('bili_copy');
        qrOpen.hidden = false;
      }
      /* 有链接才挂按钮: 没链接就干脆不画, 不留一颗点了只会滚回顶部的空按钮。 */
      qrApp.textContent = t('bili_open');
      if (qrUrl) { qrApp.href = qrUrl; qrApp.hidden = false; }
      else { qrApp.removeAttribute('href'); qrApp.hidden = true; }
      stat.textContent = r.phase === 'confirm' ? t('bili_confirm') : t('bili_wait');
    } else if (r.phase === 'expired' || r.phase === 'failed') {
      stop(); qrBox.hidden = true; shownQr = '';
      stat.textContent = t('bili_expired');
      btn.textContent = t('bili_again');
    }
  };
  async function load() {
    try {
      const r = await (await fetch(base + 'api/bili?pv=' + PAGE_VER)).json();
      pageVerCheck(r);
      apply(r);
    } catch (e) {}
  }
  load();
}

function prefCard(it, after, save) {
  const card = el('div', 'list pcard');
  // 一颗按钮就是一整张卡时(比如「立即开始」), 标题和按钮字样一样, 不再重复画一遍标题。
  if (!(it.kind === 'action' && it.label === it.value && !it.hint)) {
    const head = el('div', 'item phead');
    const txt = el('span', 'txt');
    txt.appendChild(el('span', '', it.label));
    if (it.hint) txt.appendChild(el('span', 'sub', it.hint));
    head.appendChild(txt);
    card.appendChild(head);
  }
  const changed = save ? (k, v) => save(k, v) : (k, v) => setPref(k, v, after);

  if (it.kind === 'seg' || it.kind === 'minutes') {
    const row = el('div', 'prow');
    const lines = it.rows && it.rows.length ? it.rows : [null];
    const wrap = el('div', 'prows');
    for (const line of lines) {
      const r = row.cloneNode(false);
      for (const o of it.options || []) {
        if (line && !line.includes(o.value)) continue;
        const btn = el('button', 'pbtn', o.label);
        btn.type = 'button';
        const on = o.value === it.value;
        btn.setAttribute('aria-checked', on ? 'true' : 'false');
        btn.onclick = () => {
          if (it.key === 'pin') return pinPick(o.value === '1');
          if (on) return;
          btn.disabled = true; changed(it.key, o.value);
        };
        r.appendChild(btn);
      }
      wrap.appendChild(r);
    }
    card.appendChild(wrap);
    if (it.custom || it.kind === 'minutes') card.appendChild(customRow(it, changed));
  } else if (it.kind === 'num') {
    card.appendChild(customRow(it, changed));
  } else if (it.kind === 'slider') {
    const row = el('div', 'item psld');
    if (it.muted) row.classList.add('muted');
    const mute = el('button', 'mutebtn', it.muted ? t('unmute') : t('mute'));
    mute.type = 'button';
    mute.setAttribute('aria-checked', it.muted ? 'true' : 'false');
    mute.setAttribute('aria-label', it.muted ? t('unmute') : t('mute'));
    mute.onclick = () => changed(it.key + 'Muted', it.muted ? '0' : '1');
    const min = it.min ?? 0, max = it.max ?? 100;
    const wrap = el('div', 'rg');
    const track = el('span', 'track');
    const fill = el('span', 'fill');
    const knob = el('span', 'knob');
    const rg = el('input', ''); rg.type = 'range'; rg.min = min; rg.max = max; rg.value = it.value;
    rg.setAttribute('aria-label', it.label);
    const val = el('span', 'val', it.value);
    const paint = () => {
      const p = Math.max(0, Math.min(1, (parseInt(rg.value, 10) - min) / (max - min)));
      const travel = Math.max(0, wrap.clientWidth - 24);   // 圆点中心能走的那一段
      knob.style.left = (p * travel) + 'px';
      fill.style.width = (p * travel + 12) + 'px';          // 蓝条一路铺到圆点中心, 不是铺到圆点左边缘
    };
    rg.oninput = () => { val.textContent = rg.value; paint(); };
    rg.onchange = () => changed(it.key, rg.value);
    wrap.append(track, fill, knob, rg);
    row.append(mute, wrap, val);
    // 刚进 DOM 时宽还是 0, 等布局出来再摆一次; 之后屏幕转过来/宽度变了也重摆。
    paint();
    requestAnimationFrame(paint);
    if (window.ResizeObserver) new ResizeObserver(paint).observe(wrap);
    card.appendChild(row);
  } else if (it.kind === 'action') {
    // 一颗按钮也按选项那排的样式画(灰底圆角、蓝字加粗), 只占一排一颗: 和上面那些选项看着是一家。
    const wrap = el('div', 'prows');
    const row = el('div', 'prow');
    const btn = el('button', 'pact', it.value || it.label);
    btn.type = 'button';
    btn.onclick = async () => { btn.disabled = true; await changed(it.key, '1'); btn.disabled = false; };
    row.append(btn); wrap.append(row); card.appendChild(wrap);
  } else if (it.kind === 'info') {
    // 只读一行: 系统屏保的开始时间由固件定, 改不了, 照电视那样只显示值。
    const row = el('div', 'item pinfo');
    row.appendChild(el('span', 'val', it.value || ''));
    card.appendChild(row);
  } else if (it.kind === 'bili') {
    biliCard(card);
  } else if (it.kind === 'open') {
    // 与「按网络定位」那两颗同一款按钮, 不再是一条带箭头的列表行。
    const k = (prefs && prefs.kids) || {};
    const label = !k.enabled ? t('kids_row_off')
      : (k.kind === 'elders' ? t('kids_row_elders') : t('kids_row_kids'));
    const wrap = el('div', 'prows');
    const row = el('div', 'prow');
    const btn = el('button', 'pact', label);
    btn.type = 'button';
    btn.onclick = () => openKidsGate();
    row.appendChild(btn); wrap.appendChild(row); card.appendChild(wrap);
  }
  return card;
}

/* 关于 Aerial: 和电视面板同一套更新逻辑(Updates), 手机上只负责显示状态、按下这两颗按钮。
   检查中/下载中要有进度, 所以是轮询 /api/update, 而不是等一次响应。 */
let upData = null, upTimer = 0, upWired = false;
async function loadUpdate() {
  try {
    upData = await (await fetch(base + 'api/update', { cache: 'no-store' })).json();
    paintUpdate();
  } catch (e) {}
}
function paintUpdate() {
  const d = upData; if (!d) return;
  const now = $('#upNow'); if (now) now.textContent = t('up_cur', { v: d.current, c: d.code });
  const hint = $('#upHint'); if (hint) hint.textContent = t('up_hint');
  const phase = d.phase || 'idle', pct = d.percent || 0;
  let text = '';
  // 进度只画在「下载并安装」那颗按钮上, 状态那行说人话, 不重复一个百分比。
  if (d.checking) text = t('up_checking');
  else if (phase === 'opened') text = t('up_opened');
  else if (phase === 'perm' || phase === 'storage') text = t('up_perm');
  else if (phase === 'failed') text = t('up_fail_dl');
  else if (phase === 'waiting') text = t('up_wait');
  else if (d.available) text = t('up_new', { v: d.available });
  else if (d.failed) text = t('up_fail');
  else if (d.upToDate) text = t('up_latest');
  const st = $('#upState'); if (st) st.textContent = text;
  const ck = $('#upCheck');
  if (ck) { ck.disabled = !!d.checking || phase === 'download'; ck.textContent = d.checking ? t('up_checking') : t('up_check'); }
  const inst = $('#upInstall');
  if (inst) {
    const show = !!d.available && phase !== 'opened';
    inst.hidden = !show;
    if (show) inst.textContent = phase === 'download' ? t('up_dl', { p: pct }) : t('up_install', { v: d.available });
  }
  const busy = !!d.checking || phase === 'download';
  if (busy && !upTimer) upTimer = setInterval(loadUpdate, 1500);
  if (!busy && upTimer) { clearInterval(upTimer); upTimer = 0; }
}
function wireUpdate() {
  if (upWired) { loadUpdate(); return; }
  upWired = true;
  const ck = $('#upCheck');
  if (ck) ck.onclick = async () => {
    try { upData = await (await fetch(base + 'api/update/check', { method: 'POST' })).json(); paintUpdate(); } catch (e) {}
    loadUpdate();
  };
  const inst = $('#upInstall');
  if (inst) inst.onclick = async () => {
    try { upData = await (await fetch(base + 'api/update/install', { method: 'POST' })).json(); paintUpdate(); } catch (e) {}
    loadUpdate();
  };
  loadUpdate();
}

/* 大标题是吸顶的, 分类选项卡要贴在它下面: 量一次高度写进 CSS 变量, 换语言/转屏再量。 */
function measureHead() {
  const h = document.querySelector('header');
  if (!h) return;
  // 只量一次会拿到空标题时的高度(28px 内边距 + 4px), 选项卡就贴着屏幕顶被大标题吞掉;
  // 所以换标题、字体到位、尺寸变化都要重量。
  const hh = Math.round(h.getBoundingClientRect().height);
  document.documentElement.style.setProperty('--headh', hh + 'px');
}
window.addEventListener('resize', measureHead);
window.addEventListener('orientationchange', measureHead);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureHead);
if (window.ResizeObserver) { const h = document.querySelector('header'); if (h) new ResizeObserver(measureHead).observe(h); }

/* 进儿童与长辈窗口前先验密码: 没设过就先设一个, 设过就核对一次。 */
function openKidsGate() {
  const k = (prefs && prefs.kids) || {};
  if (!k.pinSet) { pinSheet('create', false, () => openKids()); return; }
  pinSheet('verify', !!k.pinArrows, () => openKids());
}

/* 儿童与长辈窗口: 上面是细则, 下面是两页卡片(应用 / 直播), 每页带封面与勾选编号。
   细则一多就把整屏盖满了, 用户口径是这个窗口不必那么高: 矮一档, 里面自己滚。 */
let kidsTab = 0;
function openKids() {
  openSheet(body => {
    const k = prefs && prefs.kids; if (!k) return;
    body.appendChild(el('h3', '', k.title));
    if (k.hint) body.appendChild(el('p', 'meta', k.hint));
    const refresh = () => openKids();
    for (const it of k.items || []) body.appendChild(prefCard(it, refresh));

    const tabs = el('div', 'ptabs');
    [k.appsTitle, k.liveTitle].forEach((label, i) => {
      const b = el('button', '', label); b.type = 'button';
      b.setAttribute('aria-checked', kidsTab === i ? 'true' : 'false');
      b.onclick = () => { kidsTab = i; refresh(); };
      tabs.appendChild(b);
    });
    body.appendChild(tabs);
    if (k.appsHint) body.appendChild(el('p', 'foot', k.appsHint));

    const list = kidsTab === 0 ? (k.apps || []) : (k.live || []);
    const allowed = k.allowed || [];
    const inPage = allowed.filter(v => list.some(c => c.value === v));
    if (!list.length) body.appendChild(el('p', 'meta', kidsTab === 0 ? (k.emptyApps || '') : (k.emptyLive || '')));
    const grid = el('div', 'kgrid');
    for (const c of list) {
      const tile = el('button', 'kcard'); tile.type = 'button';
      const pos = inPage.indexOf(c.value);
      tile.setAttribute('aria-checked', pos >= 0 ? 'true' : 'false');
      const img = el('img'); img.src = base + (c.art || ''); img.alt = ''; img.loading = 'lazy';
      const num = el('span', 'knum', pos >= 0 ? String(pos + 1) : '');
      const cap = el('span', 'kc', c.label || c.value);
      tile.append(img, num, cap);
      if (c.locked) {
        tile.disabled = true;
        tile.appendChild(el('span', 'klock', t('must_keep')));
      } else {
        tile.onclick = () => {
          const now = allowed.slice();
          const next = pos >= 0 ? now.filter(v => v !== c.value) : now.concat([c.value]);
          tile.disabled = true;
          setPref('kidsAllowed', next.join('\n'), refresh);
        };
      }
      grid.appendChild(tile);
    }
    body.appendChild(grid);
  }, 'short');
}

/* 家长密码弹层: 4 位数字或 4 个方向键。create 设新的, verify 只核对, off 用现有密码关掉。 */
function pinSheet(mode, arrowsDefault, done) {
  let arrows = !!arrowsDefault;
  let typed = '';
  let first = null;   // create 要输两遍: 第一遍存这里, 第二遍核对(和电视面板一样)
  const reopen = () => pinSheet(mode, arrows, done);
  openSheet(body => {
    const titleEl = el('h3', '', '');
    const metaEl = el('p', 'meta', '');
    const paintTitle = () => {
      titleEl.textContent = mode === 'off' ? t('pin_off_title')
        : mode === 'verify' ? t('pin_verify_title')
        : (first === null ? t('pin_new') : t('pin_confirm'));
      metaEl.textContent = arrows ? t('pin_arrows_hint') : t('pin_digits_hint');
    };
    paintTitle();
    body.append(titleEl, metaEl);
    if (mode === 'create') {
      const tabs = el('div', 'ptabs');
      [t('pin_digits'), t('pin_arrows')].forEach((label, i) => {
        const b = el('button', '', label); b.type = 'button';
        b.setAttribute('aria-checked', (!arrows) === (i === 0) ? 'true' : 'false');
        b.onclick = () => { if (arrows !== (i === 1)) { arrows = i === 1; typed = ''; reopen(); } };
        tabs.appendChild(b);
      });
      body.appendChild(tabs);
    }
    const dots = el('div', 'pin-dots');
    const paintDots = () => {
      dots.replaceChildren();
      for (let i = 0; i < 4; i++) dots.appendChild(el('span', 'pin-dot' + (i < typed.length ? ' on' : '')));
    };
    paintDots();
    body.appendChild(dots);
    const submit = async () => {
      if (typed.length !== 4) return;
      if (mode === 'create') {
        if (first === null) { first = typed; typed = ''; paintDots(); paintTitle(); return; }
        if (first !== typed) {
          toast(t('pin_mismatch'));
          first = null; typed = ''; paintDots(); paintTitle(); return;
        }
      }
      const prefix = mode === 'create' ? 'set:' : mode === 'off' ? 'off:' : 'check:';
      const ok = await setPref('pin', prefix + typed, null, mode === 'verify');
      if (!ok) { if (mode !== 'create') toast(t('pin_wrong')); typed = ''; paintDots(); return; }
      closeSheet();
      if (done) done();
    };
    const enter = ch => {
      if (typed.length >= 4) return;
      typed += ch;
      paintDots();
      if (typed.length === 4) submit();
    };
    const back = () => { typed = typed.slice(0, -1); paintDots(); };
    const key = (label, onClick, cls) => {
      const b = el('button', 'pinkey' + (cls ? ' ' + cls : ''), label);
      b.type = 'button';
      b.onclick = onClick;
      return b;
    };
    if (arrows) {
      const pad = el('div', 'pin-pad');
      pad.append(el('span'), key('↑', () => enter('U'), 'u'), el('span'));
      pad.append(key('←', () => enter('L'), 'l'), el('span'), key('→', () => enter('R'), 'r'));
      pad.append(el('span'), key('↓', () => enter('D'), 'd'), el('span'));
      body.appendChild(pad);
    } else {
      const pad = el('div', 'pin-num');
      for (const n of ['1', '2', '3', '4', '5', '6', '7', '8', '9']) pad.appendChild(key(n, () => enter(n)));
      // 下排只有 0: 左右各留空格, 0 落在中间那一列
      pad.appendChild(el('span'));
      pad.appendChild(key('0', () => enter('0'), 'zero'));
      pad.appendChild(el('span'));
      body.appendChild(pad);
    }
  });
}

/* 密码那一项: 打开就设一个新的, 关闭要先输现有的。 */

/* More tab: backup. 浏览器要等电视那头把 zip 打完、回了响应头, 才肯弹下载框; 这段十几秒里
   下载框会先冒出来再干等, 看着就像卡死。所以先在这一页把打包跑起来, 全程显示用时, 打完之后
   按钮才变成真下载链接 —— 那时候点它, 电视直接把现成的包发出来, 确认下载即刻开始。 */
let packReady = false, packBusy = false;
$('#backupBtn').href = '#';

async function packBackup() {
  const b = $('#backupBtn');
  packBusy = true; packReady = false;
  b.href = '#'; b.removeAttribute('download');
  const at = Date.now();
  const timer = setInterval(() => {
    const sec = Math.max(1, Math.round((Date.now() - at) / 1000));
    b.textContent = t('backup_packing').replace(/…$/, '') + ' ' + sec + 's';
  }, 500);
  try {
    await fetch(base + 'api/backup/prepare?fresh=1', { cache: 'no-store' });
    for (let i = 0; i < 150; i++) {
      await new Promise(r => setTimeout(r, 600));
      const d = await (await fetch(base + 'api/backup/state', { cache: 'no-store' })).json();
      if (d.state === 'ready') {
        clearInterval(timer); packBusy = false; packReady = true;
        const mb = (d.bytes / 1048576).toFixed(1);
        const sec = ((d.ms || 0) / 1000).toFixed(1);
        b.textContent = t('backup_save') + ' · ' + mb + ' MB · ' + sec + 's';
        b.href = base + 'api/backup';
        b.download = d.name || 'aerial-backup.zip';
        return;
      }
      if (d.state === 'failed') throw new Error(d.error || 'failed');
    }
    throw new Error('timeout');
  } catch (e) {
    clearInterval(timer); packBusy = false;
    b.textContent = t('backup_export');
    toast(t('backup_pack_fail'));
  }
}

$('#backupBtn').onclick = (ev) => {
  if (packReady) return;           // 已经打好包: 交给浏览器去下载
  ev.preventDefault();
  if (packBusy) { toast(t('backup_packing')); return; }
  toast(t('backup_packing'));
  packBackup();
};
$('#restoreBtn').onclick = () => $('#restoreFile').click();
// 上次导入的结果: 电视重启那一刻的回复经常到不了手机, 页面再打开时补看一次。
(async () => {
  let rid = '';
  try { rid = localStorage.getItem('aerial-restore-id') || ''; } catch (_) { }
  if (!rid) return;
  for (let i = 0; i < 6; i++) {
    try {
      const d = await (await fetch(base + 'api/restore-result?id=' + encodeURIComponent(rid))).json();
      if (d && d.state === 'ok') {
        toast(t('backup_restored'));
        try { localStorage.removeItem('aerial-restore-id'); } catch (_) { }
        return;
      }
      if (d && d.state === 'failed') {
        toast(t('backup_failed') + (d.error ? '「' + d.error + '」' : ''));
        try { localStorage.removeItem('aerial-restore-id'); } catch (_) { }
        return;
      }
    } catch (_) { }
    await new Promise(res => setTimeout(res, 1500));
  }
  try { localStorage.removeItem('aerial-restore-id'); } catch (_) { }
})();
// The file goes up as the raw body: a 300 MB backup must not be re-encoded as multipart.
$('#restoreFile').onchange = async e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (!(await confirmSheet(t('backup_confirm'), t('backup_import')))) return;
  const b = $('#restoreBtn');
  b.disabled = true; b.textContent = t('backup_restoring');
  // 恢复成功后电视会重启进程, 那条 HTTP 回复经常来不及到手机; 用这个 id 回查真实结果。
  const rid = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  // 记在手机上: 电视重启会掐断回复, 用户刷新页面时靠这个补看真实结果。
  try { localStorage.setItem('aerial-restore-id', rid); } catch (_) { }
  let done = false;
  // 手机这一侧每一步都留一份, 失败时送回电视, 两边说法不一致时才有得对。
  const steps = [];
  try {
    const r = await fetch(base + 'api/restore', {
      method: 'POST',
      headers: { 'Content-Type': 'application/zip', 'X-Restore-Id': rid },
      body: f,
    });
    const text = await r.text();
    steps.push('POST ' + r.status + ' ' + (text || '').slice(0, 200));
    let data = null;
    try { data = JSON.parse(text); } catch (_) { }
    // 儿童/长辈模式锁定时服务端回 kidsLocked JSON, 不是恢复结果, 不能当成成功。
    if (data && data.kidsLocked) { toast(t('backup_locked')); done = true; }
    else if (data && data.restored) { toast(t('backup_restored')); done = true; }
  } catch (err) { steps.push('POST 异常 ' + ((err && err.name) || '') + ' ' + ((err && err.message) || '')); }
  let reason = '';
  let serverFailed = false;
  if (!done) {
    // 拿不到回复不代表失败: 电视重启期间端口会断一会儿, 多试几次再下结论。
    for (let i = 0; i < 24; i++) {
      await new Promise(res => setTimeout(res, 1200));
      try {
        const q = await fetch(base + 'api/restore-result?id=' + encodeURIComponent(rid));
        const d = await q.json();
        steps.push((i + 1) + ' ' + ((d && d.state) || 'none'));
        if (d && d.state === 'ok') { toast(t('backup_restored')); done = true; break; }
        if (d && d.state === 'failed') { reason = d.error || ''; serverFailed = true; break; }
      } catch (_) { steps.push((i + 1) + ' 连接失败'); }
    }
  }
  if (done) {
    try { localStorage.removeItem('aerial-restore-id'); } catch (_) { }
  } else {
    // 失败要说清是哪一种: 电视明确报了失败, 和「没等到电视回话」不是一回事。
    const why = serverFailed ? reason : (steps[0].startsWith('POST 异常') ? t('backup_link_lost') : t('backup_no_reply'));
    toast(t('backup_failed') + (why ? '「' + why + '」' : ''));
    try {
      fetch(base + 'api/restore-log', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain', 'X-Restore-Id': rid },
        body: rid + '\n' + steps.join('\n'),
      }).catch(() => { });
    } catch (_) { }
  }
  b.disabled = false; b.textContent = t('backup_import');
};

/* 把一段文字塞进剪贴板: 页面在局域网 http 上, navigator.clipboard 用不了, 只能靠一个屏幕外的输入框。 */
function copyText(text) {
  const x = window.scrollX, y = window.scrollY;
  const tmp = document.createElement('textarea');
  tmp.value = text; tmp.setAttribute('aria-hidden', 'true');
  tmp.style.cssText = 'position:fixed;top:0;left:-9999px;width:1px;height:1px;opacity:0;font-size:16px';
  document.body.appendChild(tmp);
  let ok = false;
  try {
    tmp.focus({ preventScroll: true }); tmp.select(); tmp.setSelectionRange(0, tmp.value.length);
    ok = document.execCommand('copy');
  } catch (e) {}
  tmp.remove(); window.scrollTo(x, y);
  return ok;
}

function copyDiag() {
  const text = $('#diag').textContent, x = window.scrollX, y = window.scrollY;
  const tmp = document.createElement('textarea');
  tmp.value = text; tmp.setAttribute('aria-hidden', 'true');
  tmp.style.cssText = 'position:fixed;top:0;left:-9999px;width:1px;height:1px;opacity:0;font-size:16px';
  document.body.appendChild(tmp);
  let ok = false;
  try {
    tmp.focus({ preventScroll: true }); tmp.select(); tmp.setSelectionRange(0, text.length);
    ok = document.execCommand('copy');
  } catch (e) {}
  tmp.remove(); window.scrollTo(x, y);
  if (!ok) {
    // Select the text in the box so the system's Copy is one tap away.
    const sel = window.getSelection(); sel.removeAllRanges();
    const range = document.createRange(); range.selectNodeContents($('#diag')); sel.addRange(range);
  }
  return ok;
}

/*
 * The Home Screen tab: the TV's tiles in a grid as on the TV, dragged into place. A tap on a tile
 * opens one sheet with all it can do (name, icon, folder, hide); a tap on a folder opens it here.
 */
let arrView = null;            // null = Home, else the open folder's id
let arrDragging = false;       // while a tile is held, nothing re-renders under it
let arrPending = false;        // a state that arrived mid-drag, rendered on drop
function tileImg(e) { const i = el('img', 'thumb'); i.alt = ''; i.loading = 'lazy'; i.src = `${base}tile/${encodeURIComponent(e.key)}?v=${e.stamp}`; return i; }

async function lay(params, done) {
  try {
    const next = await api('api/layout', params);
    if (!next.saved) throw new Error('not saved');
    take(next); if (done) done(next);
  } catch (e) { toast(t('toast_set_fail')); stateJson = ''; render(); }
}
function folderNameOf(next, key) {
  const L = next.layout || {}; const f = Object.keys(L.folders || {}).find(id => (L.folders[id] || []).some(a => a.key === key));
  const tile = f && (L.home || []).find(e => e.id === f); return tile ? tile.label : '';
}

/* push: true going into a folder, 'back' coming out of one, false for no motion. */
function renderArrange(push) {
  if (arrDragging) { arrPending = true; return; }
  const L = (state && state.layout) || { home: [], folders: {}, hidden: [] };
  if (arrView !== null && !(L.folders || {})[arrView]) arrView = null;   // ungrouped, or emptied
  const folderTile = arrView !== null ? L.home.find(e => e.id === arrView) : null;
  const view = el('div', 'view' + (push === 'back' ? ' pop' : push ? ' push' : ''));
  if (!L.ready) view.appendChild(el('p', 'foot', t('arrange_unready'))).style.marginTop = '20px';
  if (folderTile) buildFolderView(view, folderTile, L.folders[arrView] || []);
  else buildHomeView(view, L);
  $('#homeBody').replaceChildren(view);
  $('#inputsBox').hidden = !(state.inputs || []).length || !!folderTile;
  if (tab) setTitle();
  placeShelves();
  if (push) window.scrollTo(0, 0);
}

let hiddenUnlocked = false;
/* 验过密码后要重拉一次 state: 电视被家长锁着时, 隐藏卡名单原来一条都不下发, 光重画是空的。 */
let hiddenRetry = false;
function buildHomeView(view, L) {
  if (hiddenRetry && hiddenUnlocked && !L.hidden.length && L.hiddenCount) {
    hiddenRetry = false;
    api('api/state').then(take).catch(() => {});
  }
  // 应用卡片: 一张气泡 — 标题、说明、卡片网格。
  const gc = el('div', 'list pcard'); view.appendChild(gc);
  gc.appendChild(el('div', 'ptitle', t('app_grid_h')));
  gc.appendChild(el('p', 'pdesc', t('arrange_hint')));
  const gb = el('div', 'pbody'); gc.appendChild(gb);
  const grid = tileGrid(L.home, true); grid.classList.add('incard'); gb.appendChild(grid);
  sortableGrid(grid, L.home.map(e => e.key),
    (key, target) => lay({ op: 'move', key, target }),
    i => { const e = L.home[i]; e.kind === 'folder' ? (arrView = e.id, renderArrange(true)) : tileSheet(e, null); });

  // 设过密码的机器: 隐藏的卡片先验一次密码, 验过才列出来、才按得动。标题/说明/按钮同一张气泡。
  const hiddenKey = (prefs && prefs.kids) || {};
  if (hiddenKey.pinSet && !hiddenUnlocked && (L.hidden.length || (L.locked && L.hiddenCount))) {
    view.appendChild(hiddenGateCard(t('hidden_h'), t('hidden_pin_hint'), t('hidden_pin_show'),
      () => pinSheet('verify', !!hiddenKey.pinArrows, () => { hiddenUnlocked = true; hiddenRetry = true; renderArrange(); })));
    return;
  }
  /* 原来这里不看名单就有没有, 只要电视还锁着就直接让人去电视上输入密码 ——
     手机上刚验过密码也会被这一条挡住, 名单明明已经发下来了却看不到。
     电视端的锁只在"还没设手机侧密码、名单也没发下来"时才需要人去电视操作。 */
  if (!L.hidden.length && L.locked && L.hiddenCount) { view.appendChild(el('p', 'foot', t('hidden_locked', { n: L.hiddenCount }))); return; }
  if (!L.hidden.length) { view.appendChild(el('p', 'foot', t('hidden_none'))); return; }
  view.appendChild(hiddenListCard(t('hidden_h'), L.hidden.map(e => ({
    thumb: tileImg(e), label: e.label,
    onTap: () => tileSheet(e, null, true),
    onShow: () => lay({ op: 'unhide', key: e.key }, () => toast(t('toast_shown'))),
  })), t('show_app')));
}

function buildFolderView(view, folder, apps) {
  // 文件夹名字: 一张气泡, 浅灰输入框 + 白底「保存」。
  const c1 = el('div', 'list pcard'); view.appendChild(c1);

function tileGrid(entries, shelf) {
  const grid = el('div', 'agrid');
  grid.style.setProperty('--cols', homeCols());
  if (shelf && entries.length) grid.appendChild(el('div', 'shelf'));
  for (const e of entries) {
    const tile = el('div', 'atile'); tile.dataset.key = e.key; tile.setAttribute('role', 'button'); tile.tabIndex = 0;
    tile.setAttribute('aria-label', e.label);
    const pic = el('div', 'tpic'); const img = el('img'); img.alt = ''; img.draggable = false; img.loading = 'lazy';
    img.src = `${base}tile/${encodeURIComponent(e.key)}?v=${e.stamp}`; pic.appendChild(img);
    tile.append(pic, el('span', 'n', e.label));
    grid.appendChild(tile);
  }
  return grid;
}
/* Apps a row on the TV's Home. */
function homeCols() { return (state && state.layout && state.layout.columns) || 5; }
/* The shelf sits behind Home's first row, as the glass plate does on the TV. */
function placeShelves() {
  document.querySelectorAll('#homeBody .agrid').forEach(g => {
    const shelf = g.querySelector('.shelf'); if (!shelf) return;
    const first = [...g.querySelectorAll('.atile')].slice(0, homeCols());
    const bottom = Math.max(...first.map(t => t.offsetTop + t.offsetHeight));
    // 槽顶不一定是 0(气泡里的网格给第一排让过位), 按它自己的 offsetTop 算, 底边多留 6px。
    shelf.style.height = Math.max(0, bottom + 6 - shelf.offsetTop) + 'px';
  });
}
addEventListener('resize', placeShelves);

/*
 * Everything one tile can do, in one sheet: its name, its picture, its folder, whether Home shows it.
 * An input's name goes to the input (as from its menu on the TV); an app's to the app.
 */
function tileSheet(e, inFolder, hidden) {
  const a = (state.apps || []).find(x => x.key === e.key) || { key: e.key, label: e.label, default: e.label, name: '' };
  const L = state.layout || {};
  const folders = (L.home || []).filter(x => x.kind === 'folder' && (!inFolder || x.id !== inFolder.id));
  // 气泡里的按钮: 浅灰底 + 蓝字; danger 换成红色。
  const put = (label, danger, fn) => {
    const b = el('button', 'pact soft' + (danger ? ' danger' : ''), label);
    b.type = 'button'; b.onclick = fn;
    return b;
  };
  openSheet(body => {
    const pic = el('div', 'pic'); const img = el('img'); img.src = `${base}tile/${encodeURIComponent(e.key)}?v=${e.stamp}`; pic.appendChild(img); body.appendChild(pic);
    body.appendChild(el('h3', '', e.label));
    const meta = [a.source ? (a.label === a.port ? t('tag_source') : a.port) : a.name ? t('was_named', { name: a.default }) : '', inFolder ? inFolder.label : ''].filter(Boolean).join(' · ');
    if (meta) body.appendChild(el('p', 'meta', meta));

    /* 卡片名称: 一张气泡 — 标题、说明、输入框(右边一颗保存按钮)。 */
    const nm = el('div', 'list pcard'); body.appendChild(nm);
    nm.appendChild(el('div', 'ptitle', t('sheet_name_h')));
    nm.appendChild(el('p', 'pdesc', a.source ? t('rename_hint') : t('sheet_name_desc', { name: a.default || a.label })));
    const nf = el('form', 'pfield');
    const input = el('input'); input.type = 'text'; input.value = a.name || ''; input.maxLength = 24;
    input.placeholder = a.source ? t('name_ph') : (a.default || a.label);
    input.setAttribute('enterkeyhint', 'done'); input.autocomplete = 'off'; input.setAttribute('aria-label', t('aria_rename'));
    const save = el('button', 'psave', t('save')); save.type = 'submit';
    const sync = () => save.disabled = input.value.trim() === (a.name || '');
    input.oninput = sync; sync();
    nf.append(input, save); nm.appendChild(nf);
    nf.onsubmit = async ev => {
      ev.preventDefault(); const name = input.value; closeSheet();
      try {
        const next = await api('api/app/name', { app: a.key, name });
        if (!next.saved) throw new Error('not saved');
        take(next); toast(t(name.trim() ? 'toast_renamed' : 'toast_name_reset'));
      } catch (err) { toast(t('toast_rename_fail')); }
    };

    /* 卡片图标: 一张气泡 — 上面是图标来源, 下面是「选一张图片 / 恢复默认图标」。 */
    const ic = el('div', 'list pcard'); body.appendChild(ic);
    const ib = el('div', 'pbody'); ic.appendChild(ib);
    if (a.source) {

      b.insertAdjacentHTML('beforeend', ICON.chev);
      b.onclick = () => deviceChooser(a, e);
      ib.appendChild(b);
    }
    // 图标库里有这个应用的图: 每一张按来源命名, 另有应用自带的图、或从这里手机发过去的图。
    if (!a.source && a.library) {
      const lib = `${base}library/${encodeURIComponent(a.key)}`;
      const from = by => (by && (by[LANG] || by.name)) || '';
      const library = (a.choices && a.choices.length ? a.choices : [{ id: '', on: a.icon === 'library' }]).map(c => ({
        pick: 'library', choice: c.id, from: c.from || '', on: c.on, label: t('icon_library'), by: from(c.by),
        src: c.id ? `${lib}?c=${encodeURIComponent(c.id)}&v=${a.stamp}` : `${lib}?v=${a.stamp}`,
      }));
      const choices = [...library,
        { pick: 'own', on: a.icon === 'own', label: t('icon_own'), src: `${base}tile/${encodeURIComponent(a.key)}?art=own&v=${a.stamp}` },
      ];
      if (a.custom) choices.push({ pick: 'custom', on: true, label: t('icon_custom'), src: `${base}tile/${encodeURIComponent(a.key)}?v=${a.stamp}` });
      const cl = el('div', ''); cl.setAttribute('role', 'radiogroup'); cl.setAttribute('aria-label', t('icon_h'));
      for (const c of choices) {
        const b = el('button', 'item'); b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(c.on));
        const img2 = el('img', 'ithumb'); img2.alt = ''; img2.src = c.src;

          closeSheet();
          if (c.on) return;
          try {
            const next = await api('api/icon/pick', { app: a.key, pick: c.pick, choice: c.choice || '', from: c.from || '' });
            if (!next.saved) throw new Error('not saved');

    }));

    /* 放在哪儿: 一张气泡 — 放进文件夹 / 从应用菜单隐藏 / 在应用菜单显示。 */

    const pr = el('div', 'prows'); pr.style.paddingTop = '12px'; pc.appendChild(pr);
    if (hidden) {
      pr.appendChild(put(t('show_on_home'), false, () => { closeSheet(); lay({ op: 'unhide', key: e.key }, () => toast(t('toast_shown'))); }));
    } else {
      pr.appendChild(put(t('to_folder'), false, () => folderChooser(e, folders)));
      if (inFolder) pr.appendChild(put(t('out_of_folder'), false, () => { closeSheet(); lay({ op: 'unfolder', key: e.key }, () => toast(t('toast_out_folder'))); }));
      pr.appendChild(put(t('hide_app'), true, () => { closeSheet(); lay({ op: 'hide', key: e.key }, () => toast(t('toast_hidden'))); }));
    }

    // 取消不放进气泡。
    const cxl = el('button', 'psolo', t('cancel')); cxl.type = 'button'; cxl.onclick = closeSheet; body.appendChild(cxl);
  });
}
/* The device on an input: its mark and colours on the tile, its name on the caption (as on the TV). */
/*
 * The whole icon library, as a grid of its pictures (each shows its app's logo, and the index has
 * no names). The phone loads them from the website; the TV fetches only the one picked.
 */
async function libraryChooser(a) {
  const body = $('#sheetBody'); body.replaceChildren();
  body.appendChild(el('h3', '', t('icon_more'))); body.appendChild(el('p', 'meta', a.label));
  const grid = el('div', 'libgrid'); body.appendChild(grid);
  const foot = body.appendChild(el('p', 'foot', t('icon_more_hint'))); foot.style.marginBottom = '12px';
  const c = el('div', 'list'); body.appendChild(c);
  action(c, t('cancel'), 'tint', closeSheet).style.fontWeight = '600';
  let lib;
  try { lib = await api('api/library/all'); } catch (err) { foot.textContent = t('icon_more_fail'); return; }
  // This app's own pictures first, then every other app's.
  const apps = (lib.apps || []).slice().sort((x, y) => (y.app === a.key) - (x.app === a.key));
  for (const app of apps) for (const pic of app.choices) {
    const b = el('button', 'libpic'); b.setAttribute('aria-label', app.app);
    const img = el('img'); img.alt = ''; img.loading = 'lazy'; img.src = lib.base + pic.p;
    img.onerror = () => b.remove();
    b.appendChild(img);
    b.onclick = async () => {
      closeSheet(); toast(t('toast_sending_icon'));
      try {
        const next = await api('api/icon/pick', { app: a.key, pick: 'library', choice: pic.id, from: app.app === a.key ? '' : app.app });
        if (!next.saved) throw new Error('not saved');
        take(next); toast(t('toast_icon_picked'));
      } catch (err) { toast(t('toast_set_fail')); }
    };
    grid.appendChild(b);
  }
  if (!grid.children.length) foot.textContent = t('icon_more_fail');
}
function deviceChooser(a, e) {
  const body = $('#sheetBody'); body.replaceChildren();
  body.appendChild(el('h3', '', t('source_device'))); body.appendChild(el('p', 'meta', a.port || e.label));
  const l = el('div', 'list'); body.appendChild(l);
  const choices = [{ key: '', label: t('source_plain'), sub: a.port }].concat(state.devices || []);
  for (const d of choices) {
    const b = el('button', 'item'); b.setAttribute('role', 'radio');
    const txt = el('span', 'txt', d.label); if (d.sub) txt.appendChild(el('span', 'sub', d.sub));
    b.appendChild(txt); b.insertAdjacentHTML('beforeend', ICON.tick);
    b.setAttribute('aria-checked', (a.device || '') === d.key ? 'true' : 'false');
    b.onclick = async () => {
      closeSheet();
      if ((a.device || '') === d.key) return;
      try {
        const next = await api('api/source/device', { app: a.key, device: d.key });
        if (!next.saved) throw new Error('not saved');
        take(next);
      } catch (err) { toast(t('toast_set_fail')); }
    };
    l.appendChild(b);
  }
  body.appendChild(el('p', 'foot', t('source_device_hint'))).style.marginBottom = '12px';
  const c = el('div', 'list'); body.appendChild(c);
  action(c, t('cancel'), 'tint', closeSheet).style.fontWeight = '600';
}
function folderChooser(e, folders) {
  const body = $('#sheetBody'); body.replaceChildren();
  body.appendChild(el('h3', '', t('to_folder'))); body.appendChild(el('p', 'meta', e.label));
  const l = el('div', 'list'); body.appendChild(l);
  const go = id => { closeSheet(); lay({ op: 'folder', key: e.key, folder: id || '' }, next => toast(t('toast_in_folder', { name: folderNameOf(next, e.key) }))); };
  for (const f of folders) {
    const b = el('button', 'item'); b.append(tileImg(f), el('span', 'txt', f.label)); b.onclick = () => go(f.id); l.appendChild(b);
  }
  const n = el('button', 'item tint'); n.innerHTML = ICON.plus; n.appendChild(el('span', 'txt', t('new_folder'))); n.onclick = () => go(''); l.appendChild(n);
  const c = el('div', 'list'); body.appendChild(c);
  action(c, t('cancel'), 'tint', closeSheet).style.fontWeight = '600';
}

/*
 * Drag a tile to its place, as moving one on the TV. A touch picks the tile up after a short hold
 * (a quick swipe still scrolls the page); a mouse picks it up as soon as it moves. The tile follows
 * the finger with no easing (it is under the finger), the others slide to their new slots on an
 * interruptible transition, and near the top or bottom the page scrolls. On release the tile settles
 * into its slot and the grid takes the new order at once; the TV is told after. A tap is a tap.
 * A second finger is ignored while one tile is held.
 */
/*
 * A tap opens its sheet on the lift, and the phone's browser sends the tap's click a moment later,
 * hit-tested again: it landed on the scrim that had just appeared and closed the sheet at once, or
 * on one of the sheet's buttons (issue #542, Chrome, WeChat and Samsung Internet on Android).
 */
function swallowNextClick() {
  const until = performance.now() + 600;
  const h = e => {
    document.removeEventListener('click', h, true);
    if (performance.now() < until) { e.preventDefault(); e.stopPropagation(); }
  };
  document.addEventListener('click', h, true);
  setTimeout(() => document.removeEventListener('click', h, true), 700);
}

function sortableGrid(grid, keys, onMove, onTap) {
  grid.addEventListener('pointerdown', ev => {
    const tile = ev.target.closest('.atile'); if (!tile || arrDragging || ev.button > 0) return;
    const tiles = [...grid.querySelectorAll('.atile')]; const from = tiles.indexOf(tile);
    const pid = ev.pointerId, touch = ev.pointerType !== 'mouse';
    const sx = ev.clientX, sy = ev.clientY;
    let x = sx, y = sy, lifted = false, ended = false, timer = 0, raf = 0, to = from;
    let cells = [], g0 = null;
    const blockScroll = e => { if (lifted) e.preventDefault(); };

    const lift = () => {
      lifted = true; arrDragging = true;
      try { tile.setPointerCapture(pid); } catch (e) {}
      document.addEventListener('touchmove', blockScroll, { passive: false });
      cells = tiles.map(t => ({ x: t.offsetLeft, y: t.offsetTop, w: t.offsetWidth, h: t.offsetHeight }));
      const r = grid.getBoundingClientRect(); g0 = { x: sx - r.left, y: sy - r.top };
      grid.classList.add('sorting'); tile.classList.add('lift');
      try { navigator.vibrate && navigator.vibrate(10); } catch (e) {}
      raf = requestAnimationFrame(edge);
    };
    const slotAt = (px, py) => {
      let best = from, bd = Infinity;
      cells.forEach((c, i) => { const d = (c.x + c.w / 2 - px) ** 2 + (c.y + c.h / 2 - py) ** 2; if (d < bd) { bd = d; best = i; } });
      return best;
    };
    const place = () => {
      const r = grid.getBoundingClientRect(); const gx = x - r.left, gy = y - r.top;
      tile.style.transform = `translate(${gx - g0.x}px, ${gy - g0.y}px)`;
      const next = slotAt(cells[from].x + cells[from].w / 2 + gx - g0.x, cells[from].y + cells[from].h / 2 + gy - g0.y);
      if (next === to) return;
      to = next;
      tiles.forEach((t, j) => {
        if (t === tile) return;
        const k = from < to && j > from && j <= to ? j - 1 : from > to && j >= to && j < from ? j + 1 : j;
        t.style.transform = k === j ? '' : `translate(${cells[k].x - cells[j].x}px, ${cells[k].y - cells[j].y}px)`;
      });
    };
    const edge = () => {
      // The page scrolls; on a phone the tab bar covers its bottom. On a computer the bar is the
      // side bar, whose top is 0: taken for the bottom, it scrolled the page from mid-window (#786).
      const bar = document.querySelector('nav').getBoundingClientRect();
      const top = 0, bottom = bar.top > innerHeight / 2 ? bar.top : innerHeight, zone = 70;
      const v = y < top + zone ? -(top + zone - y) / 4 : y > bottom - zone ? (y - (bottom - zone)) / 4 : 0;
      if (v) { window.scrollBy(0, Math.max(-16, Math.min(16, v))); place(); }
      raf = requestAnimationFrame(edge);
    };
    const finish = () => {
      document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', cancel);
      document.removeEventListener('touchmove', blockScroll);
      clearTimeout(timer); cancelAnimationFrame(raf);
    };
    const drop = () => {
      // Settle into the slot, then take the new order without motion.
      tile.style.transition = reducedMotion() ? 'none' : 'transform .2s var(--ease-out)';
      tile.style.transform = `translate(${cells[to].x - cells[from].x}px, ${cells[to].y - cells[from].y}px)`;
      tile.classList.remove('lift');
      setTimeout(() => {
        grid.classList.remove('sorting');
        tiles.forEach(t => { t.style.transition = 'none'; t.style.transform = ''; });
        if (to !== from) grid.insertBefore(tile, to > from ? tiles[to].nextSibling : tiles[to]);
        void grid.offsetHeight; tiles.forEach(t => t.style.transition = '');
        arrDragging = false;
        if (to !== from) onMove(keys[from], keys[to]);
        else if (arrPending) { arrPending = false; renderArrange(false); }
      }, 200);
    };
    const move = e => {
      if (e.pointerId !== pid) return;
      x = e.clientX; y = e.clientY;
      const far = Math.hypot(x - sx, y - sy);
      if (!lifted) {
        if (touch && far > 8) { ended = true; finish(); }   // a swipe: the page scrolls
        else if (!touch && far > 5) { lift(); place(); }
        return;
      }
      place();
    };
    const up = e => {
      if (e.pointerId !== pid || ended) return;
      ended = true; finish();
      if (lifted) drop(); else { swallowNextClick(); onTap(from); }
    };
    const cancel = e => {
      if (e.pointerId !== pid || ended) return;
      ended = true; finish();
      if (lifted) drop();
    };
    if (touch) timer = setTimeout(() => { if (!ended) { lift(); place(); } }, 260);
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', cancel);
  });
  // Keyboard: Enter on a focused tile is a tap.
  grid.addEventListener('keydown', e => {
    const tile = e.target.closest('.atile'); if (!tile || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault(); onTap([...grid.querySelectorAll('.atile')].indexOf(tile));
  });
}

function render() {
  if (!state) return;
  const json = JSON.stringify(state);
  if (json === stateJson) return;
  stateJson = json;
  renderWallpapers();
  renderMore();
  renderInputs();
  renderArrange(false);
  renderLive();
}

initLangSwitch();
applyI18n();
measureHead();
show((location.hash || '').slice(1) || (() => { try { return localStorage.getItem('aerial-tab'); } catch (e) { return null; } })(), true);
async function refresh() { try { state = await api('api/state'); render(); loadSaver(); } catch (e) {} }
refresh();
loadPrefs();
loadSaver();
setInterval(() => { if (!document.hidden && sheet.hidden && !arrDragging) refresh(); }, 2000);
</script>
