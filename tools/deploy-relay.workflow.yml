name: Deploy Relay Worker

# 【已弃用留档】这条 Cloudflare Workers 路线在国内不可达（*.workers.dev 被墙，
# 自定义域 relay.qust.me 属上游作者账号，本账号无法绑定）。
# 当前线上中继是阿里云函数计算 FC，部署说明见 relay/fc/README.md，不要用本模板部署。

on:
  workflow_dispatch:
  # 配好 Secret 后可放开: 推送到分支且改动 relay/ 时自动部署
  # push:
  #   branches: [merge/upstream-1.75]
  #   paths: [relay/**]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy relay Worker
        working-directory: relay
        run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Health check
        run: sleep 5 && curl -fsS https://aerial-relay-pwmyuzhaef.cn-hangzhou.fcapp.run/healthz
